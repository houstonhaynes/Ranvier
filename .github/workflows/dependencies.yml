name: Dependency submission

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependencies-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nuget:
    name: Submit NuGet dependencies
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RanvierViewRoot: ${{ github.workspace }}/dependency-view
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Prepare Ranvier.View inside the dependency scan
        run: .github/scripts/view-sibling.sh "$RanvierViewRoot"
      - name: Restore solution dependencies
        run: dotnet restore Ranvier.slnx
      - name: Submit dependency snapshot
        uses: advanced-security/component-detection-dependency-submission-action@a02aeda7a175ad4dd38a13c4d3ff2df9da8f2cf0
        with:
          detectorsCategories: NuGet
          correlator: ranvier-nuget
          fail-on-empty: true
