# Runs the extracted model against the F# core on generated programs, with new programs each run. Agreement is evidence
# that the model matches the F#, not a proof. It uses the committed proofs/differential/engine.ml, so it needs no Rocq.
name: Proofs differential

on:
  push:
    paths:
      - 'src/Ranvier/Core.fs'
      - 'src/Ranvier/Types.fs'
      - 'src/Ranvier/Platform.fs'
      - 'src/Ranvier/TimedClock.fs'
      - 'src/Ranvier/PlatformDispatcher.fs'
      - 'src/Ranvier/Positional.fs'
      - 'src/Ranvier/Trace.fs'
      - 'src/Ranvier/Ranvier.fsproj'
      - 'global.json'
      - 'proofs/**'
      - '.github/workflows/proofs-differential.yml'
  pull_request:
    paths:
      - 'src/Ranvier/Core.fs'
      - 'src/Ranvier/Types.fs'
      - 'src/Ranvier/Platform.fs'
      - 'src/Ranvier/TimedClock.fs'
      - 'src/Ranvier/PlatformDispatcher.fs'
      - 'src/Ranvier/Positional.fs'
      - 'src/Ranvier/Trace.fs'
      - 'src/Ranvier/Ranvier.fsproj'
      - 'global.json'
      - 'proofs/**'
      - '.github/workflows/proofs-differential.yml'

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-latest
    # A run takes under a minute, and setting up OCaml from nothing takes several. Fatal programs restart the process, and
    # 5% of 2000 of them, each costing a restart and at worst the watchdog, end near this limit.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '4.14.2'
      - name: Build src/Ranvier
        run: dotnet build src/Ranvier -c Release -f net10.0 --nologo
      - name: Compare the model and the F#
        run: opam exec -- bash proofs/differential/run.sh 2000 "$GITHUB_RUN_NUMBER"
