name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# These steps run the operations provided by the build CLI directly.
# Partas.Build 0.8.2 also supports redirected output and automatic GitHub stage summaries.

jobs:
  # Documentation-only changes (see .github/scripts/changes.cjs) skip the build and test jobs; formatting always runs.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.classify.outputs.docs }}
      arms: ${{ steps.classify.outputs.arms }}
      armsRuns: ${{ steps.classify.outputs.armsRuns }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/changes.cjs "$EVENT" "$FROM" "$TO" >> "$GITHUB_OUTPUT"

  scripts:
    name: Workflow scripts
    needs: changes
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test .github/scripts/*.test.cjs

  dotnet:
    name: .NET tests
    needs: changes
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The test projects target net10.0, and global.json pins the SDK. The package check runs a net8.0 consumer of
      # the netstandard2.1 build, which needs the .NET 8 runtime.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      - name: Test Ranvier.Tests
        run: dotnet test tests/Ranvier.Tests -c Release
      - name: Test Ranvier.CSharp.Tests
        run: dotnet test tests/Ranvier.CSharp.Tests -c Release
      - name: Test Ranvier.Wire.Tests
        run: dotnet test tests/Ranvier.Wire.Tests -c Release
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install pinned CSS specifications
        run: npm ci --prefix tools/Ranvier.Css.Generate --ignore-scripts
      - name: Fetch and verify individual CSS specifications
        run: node tools/Ranvier.Css.Generate/fetch-specs.mjs
      - name: Test CSS specification model and bindings
        run: dotnet test tests/Ranvier.Css.Spec.Tests -c Release
      - name: Compile generated CSS bindings and check type safety
        run: node tools/Ranvier.Css.Generate/verify-bindings.mjs
      - name: Check CSS extraction, modules and server output
        run: node tools/Ranvier.Css.Generate/verify-assets.mjs
      - name: Build automatic utility extraction fixture
        run: dotnet build tests/Ranvier.Css.Compile.Tests/Fixtures/App/App.fsproj -c Release
      - name: Test automatic composite utility extraction
        run: dotnet test tests/Ranvier.Css.Compile.Tests/Ranvier.Css.Compile.Tests.fsproj -c Release
      - name: Check the composite utility example
        run: |
          dotnet build examples/Ranvier.Css.Utilities.Example -c Release
          dotnet run --project tools/Ranvier.Css.Compile -c Release -- --project examples/Ranvier.Css.Utilities.Example/Ranvier.Css.Utilities.Example.fsproj --output examples/Ranvier.Css.Utilities.Example/out --single app.css --no-content-hash --public-path .
          dotnet run --project examples/Ranvier.Css.Utilities.Example -c Release
          node tools/Ranvier.Css.Generate/verify-utilities.mjs
      - name: Compile and extract the CSS documentation examples
        run: node docs/samples/css/verify.mjs
      - name: Install the CSS source importer
        run: npm ci --prefix tools/Ranvier.Css.Import --ignore-scripts
      - name: Test the CSS source importer
        run: node --test tools/Ranvier.Css.Import/import.test.mjs
      - name: Compile imported F# and check CSS round trips
        run: node tools/Ranvier.Css.Import/verify-import.mjs
      - name: Compile CSS reactive browser checks
        run: |
          dotnet tool restore
          dotnet fickl tests/Ranvier.Css.Browser.Tests/Ranvier.Css.Browser.Tests.fsproj -o tools/Ranvier.Css.Generate/out/browser -c Release
      - name: Check reactive CSS mount, updates, disposal and SSR identity
        run: node tools/Ranvier.Css.Generate/verify-browser.mjs
      - name: Check native CSS behavior in Chromium
        run: |
          npm exec --prefix tools/Ranvier.Css.Generate -- playwright install --with-deps chromium
          node tools/Ranvier.Css.Generate/verify-chromium.mjs
      - name: Test Ranvier.Persistence.Tests
        run: dotnet test tests/Ranvier.Persistence.Tests -c Release
      # The vendored Thoth.Json files must equal the pinned upstream commit plus src/Ranvier.Wire/Vendor/Thoth.Json/patches.
      - name: Check the vendored Thoth.Json
        shell: pwsh
        run: ./src/Ranvier.Wire/Vendor/Thoth.Json/refresh.ps1 -Check
      # The trace log and its queries compile in only with RanvierTrace, and their tests with them.
      - name: Test Ranvier.Tests, traced
        run: dotnet test tests/Ranvier.Tests -c Release -p:RanvierTrace=true
      # The signal map model reads the trace log, so its tests compile only in a traced build.
      - name: Test Ranvier.Docs.Maps.Tests, traced
        run: dotnet test docs/maps/tests -c Release -p:RanvierTrace=true
      - name: Check package compatibility
        shell: pwsh
        run: ./tests/check-package-compatibility.ps1

  marten:
    name: Marten store adapter
    needs: changes
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ranvier-tests
          POSTGRES_DB: ranvier
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ranvier"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RANVIER_MARTEN_CONNECTION: Host=localhost;Port=5432;Database=ranvier;Username=postgres;Password=ranvier-tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Test the adapter against PostgreSQL
        run: dotnet test tests/Ranvier.Persistence.Marten.Tests -c Release
      - name: Pack the adapter
        run: dotnet pack adapters/Ranvier.Persistence.Marten -c Release --no-build
      - name: Test the adapter with traced persistence
        run: dotnet test tests/Ranvier.Persistence.Marten.Tests -c Release -p:RanvierTrace=true
      - name: Pack the traced adapter
        run: dotnet pack adapters/Ranvier.Persistence.Marten -c Release -p:RanvierTrace=true --no-build

  kurrentdb:
    name: KurrentDB store adapter
    needs: changes
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      kurrentdb:
        image: docker.kurrent.io/kurrent-latest/kurrentdb@sha256:e5c9d59716174a4a47f9d54d6ce45aaaca48114b7ee668135aeb9f16934d74c8
        env:
          KURRENTDB_INSECURE: "true"
          KURRENTDB_CLUSTER_SIZE: "1"
        ports:
          - 2113:2113
        options: >-
          --health-cmd "curl --fail --silent http://localhost:2113/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    env:
      RANVIER_KURRENTDB_CONNECTION: kurrentdb://localhost:2113?tls=false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Test the adapter against KurrentDB
        run: dotnet test tests/Ranvier.Persistence.KurrentDB.Tests -c Release
      - name: Pack the adapter
        run: dotnet pack adapters/Ranvier.Persistence.KurrentDB -c Release --no-build
      - name: Test the adapter with traced persistence
        run: dotnet test tests/Ranvier.Persistence.KurrentDB.Tests -c Release -p:RanvierTrace=true
      - name: Pack the traced adapter
        run: dotnet pack adapters/Ranvier.Persistence.KurrentDB -c Release -p:RanvierTrace=true --no-build

  equinox:
    name: Equinox FsCodec sample
    needs: changes
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      kurrentdb:
        image: docker.kurrent.io/kurrent-latest/kurrentdb@sha256:e5c9d59716174a4a47f9d54d6ce45aaaca48114b7ee668135aeb9f16934d74c8
        env:
          KURRENTDB_INSECURE: "true"
          KURRENTDB_CLUSTER_SIZE: "1"
        ports:
          - 2113:2113
        options: >-
          --health-cmd "curl --fail --silent http://localhost:2113/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    env:
      RANVIER_EQUINOX_CONNECTION: esdb://localhost:2113?tls=false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Test the sample against KurrentDB
        run: dotnet test tests/Ranvier.Persistence.Equinox.Tests -c Release
      - name: Run the persisted signal round trip
        run: dotnet run --project samples/Ranvier.Persistence.Equinox -c Release --no-build -- ci-round-trip
      - name: Test the sample with traced persistence
        run: dotnet test tests/Ranvier.Persistence.Equinox.Tests -c Release -p:RanvierTrace=true
      - name: Run the traced round trip
        run: dotnet run --project samples/Ranvier.Persistence.Equinox -c Release -p:RanvierTrace=true --no-build -- ci-traced-round-trip

  # A NativeAOT publish over the library assemblies, Ranvier.Wire and Ranvier.Persistence included, rooted: any IL2xxx/IL3xxx warning fails
  # the publish, and the binary exits non-zero when an exception or a ToString text differs from the expected text,
  # with tracing on and off.
  aot:
    name: NativeAOT smoke (trace=${{ matrix.trace }})
    needs: changes
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        trace: [false, true]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Publish
        run: dotnet publish tests/Ranvier.AotSmoke -c Release -r linux-x64 -p:RanvierTrace=${{ matrix.trace }} -o artifacts/aot
      - name: Run
        run: ./artifacts/aot/Ranvier.AotSmoke

  # The publish command's release pipeline with the push replaced by a listing: builds, packs every source project
  # untraced and traced and the analyzers, then checks each package's id, version, lib frameworks and trace build, and
  # the analyzer package's layout. The .NET tests job runs the suites, so --skip-tests leaves them out here.
  packages:
    name: Packages
    needs: changes
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Pack and dry-publish
        run: dotnet fsi build.fsx -- publish --dry-publish --skip-tests
      - name: Pack persistence adapters
        run: |
          for project in adapters/*/*.fsproj; do
            dotnet pack "$project" -c Release -p:RanvierTrace=false -o bin
            dotnet pack "$project" -c Release -p:RanvierTrace=true -o bin
          done
      - name: Check the packages
        run: node .github/scripts/packages.cjs bin src tools/Ranvier.Analyzers/Ranvier.Analyzers.fsproj --libraries adapters/*/*.fsproj
      - uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: bin/*.nupkg
          if-no-files-found: error

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore tools
        run: dotnet tool restore
      # Tracked F# sources only: `build.fsx --dry-format` also globs untracked output such as dist/.
      - name: Check formatting
        run: dotnet fantomas --check $(git ls-files '*.fs' ':(exclude)src/Ranvier.Wire/Vendor/**')

  # Every page under docs/content is in a Theme.menu of docs/Site.fs (docs/MenuCoverage.fs). Runs on
  # documentation-only changes too: the site itself builds only after a merge, in docs.yml.
  docs-menus:
    name: Docs menu coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Check every docs page is in a menu
        run: dotnet run --project docs/docs.fsproj -- check-menus

  fable:
    name: Fable tests
    needs: changes
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install npm packages
        run: npm ci
      - name: Restore tools
        run: dotnet tool restore
      - name: Compile the tests
        run: dotnet fickl fable/Ranvier.Tests.Fable -e .fs.js -o dist/tests -c Release
      - name: Compile the traced tests
        run: dotnet fickl fable/Ranvier.Tests.Fable -e .fs.js -o dist/tests-traced -c Release
        env:
          RanvierTrace: 'true'
      - name: Run the tests and report
        run: node fable/Ranvier.Tests.Fable/Report.mjs
      - name: Check Fable package consumers
        shell: pwsh
        run: ./tests/check-package-compatibility.ps1 -CheckFable

  # The Fable playground and the view layer (src/Ranvier.View and src/Ranvier.View.Dom, with the checks and the twin
  # under experiments/): the jsdom suites (with the view counters defined), the Chromium suite through Playwright, and
  # the view layer's .NET representation checks. Documentation-only changes skip it with the other build jobs;
  # everything under examples/Fable.Ranvier.Playground, experiments/, src/ and tools/Ranvier.Dom.Generate is
  # non-documentation and runs it.
  playground:
    name: Playground
    needs: changes
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/Fable.Ranvier.Playground
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # The playground requires Node 26 or newer (package.json engines).
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: examples/Fable.Ranvier.Playground/package-lock.json
      - name: Install npm packages
        run: npm ci
      - name: Restore tools
        run: dotnet tool restore
        working-directory: .
      - name: Run the view layer representation checks
        run: dotnet run --project experiments/Ranvier.View.Checks/RepresentationChecks.fsproj -c Release
        working-directory: .
      # Compiles every F# sample of the Views and Server docs sections and checks the HTML the pages quote.
      - name: Run the docs view samples
        run: dotnet run --project docs/samples/view/Ranvier.Docs.ViewSamples.fsproj -c Release
        working-directory: .
      # Fails when a committed sample differs from the fsharp blocks of its page.
      - name: Check the docs view samples against their pages
        run: dotnet fsi docs/samples/view/Generate.fsx --check
        working-directory: .
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # npm test runs the package's whole test chain: the jsdom suites (test:dom, with the view counters defined)
      # and the Chromium suite (test:browser), plus any suites the script gains.
      - name: Run the playground tests
        run: npm test
      # The conformance cases on the DOM twin, then the byte comparison with the jsdom run's artefacts (spec §6.3).
      - name: Run the conformance cases on the twin
        run: dotnet test tests/Ranvier.View.Twin.Tests -c Release
        working-directory: .
      - name: Compare the jsdom and twin artefacts
        run: node tests/conformance-diff.mjs

  # The DOM generator's three script gates: generated usage compiles or fails with the expected FS code
  # (CheckTypes), the generator's output and corrupt-catalogue rejection (GeneratorTests), and the view sugar
  # README samples compile (CheckDocs). Each script exits non-zero on failure. CheckTypes and CheckDocs build
  # DomTests.fsproj, so they run in a job of their own, with the same non-documentation gate as the other jobs.
  sugar:
    name: View sugar checks
    needs: changes
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # GeneratorTests runs the generator, which reads the TypeScript compiler from this directory's node_modules.
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: tools/Ranvier.Dom.Generate/package-lock.json
      - name: Install the generator's npm packages
        run: npm ci
        working-directory: tools/Ranvier.Dom.Generate
      - name: Check the generator output (GeneratorTests)
        run: dotnet fsi tools/Ranvier.Dom.Generate/GeneratorTests.fsx
      - name: Check the README samples compile (CheckDocs)
        run: dotnet fsi tools/Ranvier.Dom.Generate/CheckDocs.fsx
      - name: Check generated usage types (CheckTypes)
        run: dotnet fsi tools/Ranvier.Dom.Generate/CheckTypes.fsx

  # The Fable.Ranvier.Anime bindings compiled with Fable: the jsdom value checks on a mocked clock, the emit checks of the
  # bindings and their call sites, and the bindings bundle-size budget (fable/Ranvier.Anime.Tests/size.mjs).
  anime:
    name: Anime bindings
    needs: changes
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fable/Ranvier.Anime.Tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # The suite requires Node 26 or newer (package.json engines).
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: fable/Ranvier.Anime.Tests/package-lock.json
      - name: Install npm packages
        run: npm ci
      - name: Restore tools
        run: dotnet tool restore
        working-directory: .
      # npm test compiles the suite, runs the value and emit checks, then the bundle-size check.
      - name: Run the bindings tests
        run: npm test
      - name: Check typed CSS animation in Chromium
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      # size.mjs rewrites the committed bundle numbers; a difference means they are stale. Stale numbers warn; the budget
      # check in npm test is the gate.
      - name: Check the committed bundle numbers
        run: git diff --exit-code -- docs/research/motion/bindings-bundle.json || echo "::warning file=docs/research/motion/bindings-bundle.json::Committed bundle numbers are stale; run npm test in fable/Ranvier.Anime.Tests and commit the file."
        working-directory: .

  # The Ranvier.View.Anime template parts compiled with Fable: the jsdom checks of every Motion part on a mocked clock,
  # the README sample check, and the bundle budget (fable/Ranvier.View.Anime.Tests/motion-size.mjs); then, on .NET, the
  # server renders of the README samples against their twins without Motion parts.
  motion-view:
    name: Motion view parts
    needs: changes
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fable/Ranvier.View.Anime.Tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # The suite requires Node 26 or newer (package.json engines).
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: fable/Ranvier.View.Anime.Tests/package-lock.json
      - name: Install npm packages
        run: npm ci
      - name: Restore tools
        run: dotnet tool restore
        working-directory: .
      # npm test compiles the suite, runs the jsdom and README checks, then the bundle-size check.
      - name: Run the Motion part tests
        run: npm test
      # motion-size.mjs rewrites the committed bundle numbers; a difference means they are stale. Stale numbers warn; the
      # budget check in npm test is the gate.
      - name: Check the committed bundle numbers
        run: git diff --exit-code -- docs/research/motion/bundle.json || echo "::warning file=docs/research/motion/bundle.json::Committed bundle numbers are stale; run npm test in fable/Ranvier.View.Anime.Tests and commit the file."
        working-directory: .
      - name: Check the server renders against their twins
        run: dotnet run --project fable/Ranvier.View.Anime.Tests/Ranvier.View.Anime.Tests.fsproj -c Release
        working-directory: .

  # The five Motion example pages (examples/Ranvier.Motion): the jsdom page checks on a mocked clock, the story's .NET
  # server document against its twin without Motion parts, and the Chromium checks on the page clock (npm test), then the
  # per-page bundle sizes, reported without a budget.
  motion:
    name: Motion examples
    needs: changes
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/Ranvier.Motion
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # The examples require Node 26 or newer (package.json engines).
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: examples/Ranvier.Motion/package-lock.json
      - name: Install npm packages
        run: npm ci
      - name: Restore tools
        run: dotnet tool restore
        working-directory: .
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # npm test compiles the page checks and runs them under jsdom (test:dom), then compiles the pages, renders the
      # story document on .NET (ServerChecks, which fails when it differs from its twin without Motion parts), and runs
      # the Chromium suite against the Vite server on port 5179 (test:browser).
      - name: Run the Motion example tests
        run: npm test
      # The pages were compiled by npm test; size:only bundles them without compiling again.
      - name: Report the per-page bundle sizes
        run: npm run size:only
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: motion-playwright
          path: |
            examples/Ranvier.Motion/playwright-report/
            examples/Ranvier.Motion/test-results/
          if-no-files-found: ignore

  hydration:
    name: Server hydration example
    needs: changes
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/Ranvier.Hydration
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: examples/Ranvier.Hydration/package-lock.json
      - name: Install npm packages
        run: npm ci
      - name: Restore tools
        run: dotnet tool restore
        working-directory: .
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the hydration example tests
        run: npm test
      - name: Check the alternative backend sources
        run: |
          dotnet build docs/samples/server-backends/Oxpecker/Oxpecker.fsproj -c Release
          dotnet build docs/samples/server-backends/Suave/Suave.fsproj -c Release
          node docs/samples/server-backends/smoke.mjs
        working-directory: .
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hydration-playwright
          path: |
            examples/Ranvier.Hydration/playwright-report/
            examples/Ranvier.Hydration/test-results/
          if-no-files-found: ignore

  # Arms.Match (experiments/Ranvier.View.Arms): the Fable plugin's tests, the discovery app, the jsdom suites (test:arms),
  # the bundle budget, Arms.Prepare on both runtime targets, and the trim annotation. The .NET lowering, fixture, golden
  # and runtime checks run inside the representation checks of the playground job.
  # It runs only when the change touches the view, the core, the Playground or the toolchain (changes.cjs armsAffected).
  arms:
    name: Arms.Match
    needs: changes
    if: needs.changes.outputs.arms == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # global.json pins the SDK; DotnetCost also runs on net8.0, the library's other target, which needs the .NET 8 runtime.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      # The Playground requires Node 26 or newer (package.json engines).
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: examples/Fable.Ranvier.Playground/package-lock.json
      - name: Restore tools
        run: dotnet tool restore
      # sourcemap.mjs in the plugin tests reads the Playground's node_modules.
      - name: Install npm packages
        run: npm ci
        working-directory: examples/Fable.Ranvier.Playground
      - name: Build the Fable plugin
        run: dotnet build experiments/Ranvier.View.Arms.FablePlugin/Ranvier.View.Arms.FablePlugin.fsproj -c Release
      - name: Run the plugin tests
        run: dotnet fsi experiments/Ranvier.View.Arms.FablePlugin/Tests/PluginTests.fsx
      # The documented opt-in (a project reference and the .targets): the same server HTML on .NET and under Fable, and
      # no plugin assembly in the .NET output.
      - name: Run the discovery app on both targets
        run: |
          dotnet run --project experiments/Ranvier.View.Arms/Checks/Discovery/Discovery.fsproj -c Release > discovery-net.txt
          dotnet fickl experiments/Ranvier.View.Arms/Checks/Discovery/Discovery.fsproj --outDir experiments/Ranvier.View.Arms/Checks/Discovery/out -c Release --noCache
          node experiments/Ranvier.View.Arms/Checks/Discovery/out/Main.js > discovery-fable.txt
          diff --strip-trailing-cr discovery-net.txt discovery-fable.txt
          grep -q armsTag_L experiments/Ranvier.View.Arms/Checks/Discovery/out/Main.js
          test ! -e experiments/Ranvier.View.Arms/Checks/Discovery/bin/Release/net10.0/Ranvier.View.Arms.FablePlugin.dll
          test ! -e experiments/Ranvier.View.Arms/Checks/Discovery/bin/Release/net10.0/Fable.AST.dll
      - name: Run the arms suites
        run: npm run test:arms
        working-directory: examples/Fable.Ranvier.Playground
      # size.mjs compiles its own Release build with no defines, so the counters build of test:arms does not reach it.
      - name: Check the bundle budget
        run: node experiments/Ranvier.View.Arms/Checks/size.mjs
      # size.mjs rewrites the committed bundle numbers, absolute sizes of the whole view included, so a view or core change
      # needs a local size.mjs run; a difference means they are stale. Stale numbers warn; the budget step above is the gate.
      - name: Check the committed bundle numbers
        run: git diff --exit-code -- docs/research/arms-match/bundle.json || echo "::warning file=docs/research/arms-match/bundle.json::Committed bundle numbers are stale; run node experiments/Ranvier.View.Arms/Checks/size.mjs and commit the file."
      # The committed Chromium and heap results hold their gates (the benchmark itself runs on a local machine, not CI).
      # The pool holds the runs whose recorded sources match the tree, so these two steps run only for a change to the
      # lowering, its benchmark or its runs (changes.cjs armsRunsAffected); a core, view or lock-file change alone skips them.
      - name: Check the committed Chromium and heap results
        if: needs.changes.outputs.armsRuns == 'true'
        run: node experiments/Ranvier.View.Arms/Checks/chromium-gate.mjs
      # The budgets are fixed (plan 2026-10-24-issue-157.md, P9). keyed-rows.mjs checks a run's source hashes and bundle
      # when it writes the run.
      - name: Check the Chromium budgets against the pooled interval
        if: needs.changes.outputs.armsRuns == 'true'
        run: node --test experiments/Ranvier.View.Arms/Checks/pooled-interval.test.mjs
      # The timings print without a budget (shared runners are not the budget's machine); a raise or a wrong render from
      # Arms.Prepare, called twice and on four threads at once, fails the step.
      - name: Run Arms.Prepare and the lowering costs on net10.0 and net8.0
        run: |
          dotnet run --project experiments/Ranvier.View.Arms/Checks/DotnetCost/DotnetCost.fsproj -c Release -f net10.0 -- --prepare
          dotnet run --project experiments/Ranvier.View.Arms/Checks/DotnetCost/DotnetCost.fsproj -c Release -f net8.0 -- --prepare
      - name: Check the trim annotation
        run: bash experiments/Ranvier.View.Arms/Checks/TrimCallSite/check.sh linux-x64

  # Runs the Ranvier analyzers' unit tests, then the analyzers over the repository's projects with every RAN code
  # promoted to an error: any finding fails the job.
  # The analyzer suite in three shards whose filters partition it: the Fable rules with the shared tests, the core
  # rules, and the view rules.
  analyzer-tests:
    name: Analyzer tests (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: fable
            filter: FullyQualifiedName!~RAN01&FullyQualifiedName!~RAN02
          - shard: core
            filter: FullyQualifiedName~RAN01
          - shard: view
            filter: FullyQualifiedName~RAN02
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-analyzer-tests-${{ hashFiles('Directory.Packages.props', 'tools/**/*.fsproj', 'src/**/*.fsproj', 'experiments/**/*.fsproj') }}
          restore-keys: nuget-analyzer-tests-
      - name: Test the analyzers
        run: dotnet test tools/Ranvier.Analyzers.Tests -c Release --filter "${{ matrix.filter }}"

  # The repository run, one group of analyzed projects per leg (build.fsx Spec.analyzedGroups): each leg builds its
  # projects once, in parallel, and the CLI reads those outputs.
  analyzers:
    name: Analyzers (${{ matrix.group }})
    needs: changes
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        group: [library, view, examples]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-analyzers-${{ matrix.group }}-${{ hashFiles('Directory.Packages.props', '**/*.fsproj') }}
          restore-keys: nuget-analyzers-${{ matrix.group }}-
      - name: Restore tools
        run: dotnet tool restore
      - name: Build the group and run the analyzers over it
        run: dotnet fsi build.fsx -- analyze --group ${{ matrix.group }} --build
      - name: Annotate the findings
        if: always()
        run: node .github/scripts/sarif-annotations.cjs artifacts/analyzers
      - name: Upload the SARIF report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: analyzers-sarif-${{ matrix.group }}
          path: artifacts/analyzers/*.sarif

  # The external facts the analyzers describe: Fable Release's inlining of module-mutable snapshots (RAN001), the Fable
  # precompile failure on union testers (RAN002), and the MSBuild integration. A failure means a rule needs retiring or
  # rescoping.
  analyzer-truth:
    name: Analyzer truth fixtures
    needs: changes
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore tools
        run: dotnet tool restore
      - name: Check the truth fixtures
        run: dotnet fsi tools/Ranvier.Analyzers.Truth/Truth.fsx

  # The one CI check that branch rules require: it fails when any job failed or was cancelled, and passes when the
  # build and test jobs were skipped for a documentation-only change.
  result:
    name: CI result
    needs: [changes, scripts, dotnet, marten, kurrentdb, equinox, aot, packages, format, docs-menus, fable, playground, sugar, anime, motion-view, motion, hydration, analyzer-tests, analyzers, analyzer-truth, arms]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
