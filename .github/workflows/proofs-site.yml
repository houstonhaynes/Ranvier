# Compiles and audits the proofs, then builds their Navigator site. The Docs workflow places the newest site from master at
# /proofs/ of the Pages deployment, so the docs build needs no Rocq.
name: Proofs site

on:
  push:
    branches: [master]
    paths:
      - 'proofs/**'
      - 'src/Ranvier/**'
      - 'global.json'
      - '.github/workflows/proofs-site.yml'
  pull_request:
    paths:
      - 'proofs/**'
      - 'src/Ranvier/**'
      - 'global.json'
      - '.github/workflows/proofs-site.yml'
  # An artifact expires after 90 days, and a monthly build keeps one available to Docs through a quiet period.
  schedule:
    - cron: '17 4 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The artifact's name is the hash of every input of the audit and the build. Equal names hold equal sites, whichever
      # commit or merge strategy produced the inputs.
      - name: Key the site by its inputs
        id: key
        run: |
          key="$(git rev-parse HEAD:proofs HEAD:src/Ranvier HEAD:global.json HEAD:.github/workflows/proofs-site.yml | sha256sum | cut -c1-40)"
          echo "name=proofs-site-$key" >> "$GITHUB_OUTPUT"
      # A site is reused only from a run of this repository whose workflow file is this one, which computed the name by
      # the step above. A fork's run can upload under any name.
      - name: Reuse a site built from the same inputs
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NAME: ${{ steps.key.outputs.name }}
        run: |
          workflow_blob="$(git rev-parse HEAD:.github/workflows/proofs-site.yml)"
          gh api "repos/$GH_REPO/actions/artifacts?name=$NAME&per_page=20" \
            --jq '.artifacts[] | select(.expired | not) | select(.workflow_run.head_repository_id == .workflow_run.repository_id) | "\(.workflow_run.id) \(.workflow_run.head_sha)"' |
          while read -r run_id head_sha; do
            blob="$(gh api "repos/$GH_REPO/contents/.github/workflows/proofs-site.yml?ref=$head_sha" --jq .sha 2>/dev/null || true)"
            [ "$blob" = "$workflow_blob" ] || continue
            rm -rf proofs/site/output
            if gh run download "$run_id" --name "$NAME" --dir proofs/site/output; then
              echo "Reused $NAME from run $run_id."
              echo "hit=true" >> "$GITHUB_OUTPUT"
              break
            fi
          done
      - uses: actions/setup-dotnet@v6
        if: steps.reuse.outputs.hit != 'true'
        with:
          global-json-file: global.json
      - name: Install system packages
        if: steps.reuse.outputs.hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y opam libgmp-dev pkg-config unzip bubblewrap
      - id: opam-cache
        if: steps.reuse.outputs.hit != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.opam
          # Keyed by the version table alone, so an edit elsewhere in this file keeps the cache. A change to the install
          # step below changes proofs/VERSIONS.md with it.
          key: rocq-toolchain-${{ runner.os }}-${{ hashFiles('proofs/VERSIONS.md') }}
      # The versions match the table in proofs/VERSIONS.md. build.sh selects the switch by this name.
      - name: Install the Rocq toolchain
        if: steps.reuse.outputs.hit != 'true' && steps.opam-cache.outputs.cache-hit != 'true'
        env:
          OPAMYES: '1'
        run: |
          opam init --bare --disable-sandboxing --no-setup
          opam switch create ranvier-proofs ocaml-base-compiler.4.14.2
          eval "$(opam env --switch=ranvier-proofs --set-switch)"
          opam repo add rocq-released https://rocq-prover.org/opam/released
          opam repo add iris-dev https://gitlab.mpi-sws.org/iris/opam.git
          opam update
          opam install rocq-core.9.1.0 rocq-stdlib.9.2.0 rocq-stdpp.1.13.0 rocq-iris-heap-lang.4.5.0 zarith.1.14
      - name: Audit the proofs
        if: steps.reuse.outputs.hit != 'true'
        run: bash proofs/check.sh
      - name: Build the site
        if: steps.reuse.outputs.hit != 'true'
        env:
          PROOFS_BASE_URL: /Ranvier/proofs/
        run: bash proofs/site.sh
      # A reused site is uploaded again, which restarts its retention.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.key.outputs.name }}
          path: proofs/site/output
          retention-days: 90
          if-no-files-found: error

  publish:
    needs: site
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Deploy the documentation with the new site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run docs.yml --ref master
