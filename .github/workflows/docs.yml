name: Docs

on:
  workflow_dispatch:
    inputs:
      compiler_diagnostic:
        description: Compare the two live-compiler tests with 2 and 1 workers without deploying
        type: boolean
        default: false
  workflow_run:
    workflows: [Perf report]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.manual.outputs.ref || steps.measured.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          persist-credentials: false
          sparse-checkout: .github/scripts
      - id: manual
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ github.sha }}
        run: echo "ref=$REF" >> "$GITHUB_OUTPUT"
      - id: provenance
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v9
        with:
          script: |
            const {hasProvenance} = require('./.github/scripts/docs-perf.cjs');
            core.setOutput('present', await hasProvenance({github, repo: context.repo, run: context.payload.workflow_run}));
      - uses: actions/download-artifact@v8
        if: steps.provenance.outputs.present == 'true'
        with:
          name: docs-perf-provenance
          path: ${{ runner.temp }}/docs-perf
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - id: measured
        if: steps.provenance.outputs.present == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const {resolve} = require('./.github/scripts/docs-perf.cjs');
            const provenance = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/docs-perf/provenance.json`, 'utf8'));
            core.setOutput('ref', await resolve({github, repo: context.repo, provenance}));

  build:
    needs: resolve
    if: needs.resolve.outputs.ref != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out performance history
        uses: actions/checkout@v7
        with:
          ref: perf-data
          path: perf-data
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # The signal map browser checks require Node 26 or newer.
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            docs/maps/tests/browser/package-lock.json
      - name: Collect performance history
        run: node .github/scripts/perf-site-data.cjs perf-data/runs docs/static/perf-data/index.json
      # The signal maps compile the view projects of a Ranvier.View checkout against this core.
      - name: Check out Ranvier.View beside the repository
        run: .github/scripts/view-sibling.sh
      - name: Build the site
        run: dotnet fsi build.fsx -- docs
      - name: Install browser test dependencies
        working-directory: docs/maps/tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check the signal maps in a browser
        if: inputs.compiler_diagnostic != true
        working-directory: docs/maps/tests/browser
        run: |
          npx playwright test
      - name: Compare live compiler worker counts
        if: inputs.compiler_diagnostic == true
        working-directory: docs/maps/tests/browser
        run: node diagnose-live-compiler.mjs
      - uses: actions/upload-artifact@v7
        if: always() && inputs.compiler_diagnostic == true
        with:
          name: docs-compiler-diagnostic
          path: docs/maps/tests/browser/test-results/compiler-diagnostic
      - uses: actions/upload-artifact@v7
        if: always() && inputs.compiler_diagnostic == true
        with:
          name: docs-compiler-site
          path: docs/output
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: docs-browser-failure
          path: docs/maps/tests/browser/test-results
      # A failure leaves the documentation deployable, without the proofs.
      - name: Add the proofs site
        if: inputs.compiler_diagnostic != true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          run_id="$(gh run list --workflow proofs-site.yml --branch master --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          name=""
          if [ -n "$run_id" ]; then
            name="$(gh api "repos/$GH_REPO/actions/runs/$run_id/artifacts" --jq '[.artifacts[].name | select(startswith("proofs-site"))][0] // empty')"
          fi
          if [ -z "$name" ] || ! gh run download "$run_id" --name "$name" --dir docs/output/proofs; then
            echo "::warning::This deployment has no proofs site: no Proofs site artifact from master was available."
          fi
      - uses: actions/upload-pages-artifact@v5
        if: inputs.compiler_diagnostic != true
        with:
          path: docs/output

  deploy:
    if: github.ref == 'refs/heads/master' && inputs.compiler_diagnostic != true
    needs: [resolve, build]
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          persist-credentials: false
          sparse-checkout: .github/scripts
      - id: current
        uses: actions/github-script@v9
        env:
          MEASURED: ${{ needs.resolve.outputs.ref }}
        with:
          script: |
            const {shouldDeploy} = require('./.github/scripts/docs-perf.cjs');
            core.setOutput('deploy', await shouldDeploy({github, repo: context.repo,
              eventName: context.eventName, measured: process.env.MEASURED}));
      - id: deployment
        if: steps.current.outputs.deploy == 'true'
        uses: actions/deploy-pages@v5
