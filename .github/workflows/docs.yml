name: Docs

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Perf report]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.manual.outputs.ref || steps.measured.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          persist-credentials: false
          sparse-checkout: .github/scripts
      - id: manual
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ github.sha }}
        run: echo "ref=$REF" >> "$GITHUB_OUTPUT"
      - id: provenance
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v9
        with:
          script: |
            const {hasProvenance} = require('./.github/scripts/docs-perf.cjs');
            core.setOutput('present', await hasProvenance({github, repo: context.repo, run: context.payload.workflow_run}));
      - uses: actions/download-artifact@v8
        if: steps.provenance.outputs.present == 'true'
        with:
          name: docs-perf-provenance
          path: ${{ runner.temp }}/docs-perf
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - id: measured
        if: steps.provenance.outputs.present == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const {resolve} = require('./.github/scripts/docs-perf.cjs');
            const provenance = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/docs-perf/provenance.json`, 'utf8'));
            core.setOutput('ref', await resolve({github, repo: context.repo, provenance}));

  build:
    needs: resolve
    if: needs.resolve.outputs.ref != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out performance history
        uses: actions/checkout@v7
        with:
          ref: perf-data
          path: perf-data
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # The browser examples built into the site require Node 26 or newer.
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            examples/Ranvier.Motion/package-lock.json
            examples/Fable.Ranvier.Playground/package-lock.json
            examples/Ranvier.Hydration/package-lock.json
            docs/maps/tests/browser/package-lock.json
      - name: Collect performance history
        run: node .github/scripts/perf-site-data.cjs perf-data/runs docs/static/perf-data/index.json
      - name: Build the site
        run: dotnet fsi build.fsx -- docs
      - name: Check the signal maps in a browser
        working-directory: docs/maps/tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/output

  deploy:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          persist-credentials: false
          sparse-checkout: .github/scripts
      - id: current
        uses: actions/github-script@v9
        env:
          MEASURED: ${{ needs.resolve.outputs.ref }}
        with:
          script: |
            const {shouldDeploy} = require('./.github/scripts/docs-perf.cjs');
            core.setOutput('deploy', await shouldDeploy({github, repo: context.repo,
              eventName: context.eventName, measured: process.env.MEASURED}));
      - id: deployment
        if: steps.current.outputs.deploy == 'true'
        uses: actions/deploy-pages@v5
