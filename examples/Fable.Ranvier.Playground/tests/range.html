<!doctype html>
<html><head><title>Owned range checks</title></head><body>
<script type="module">
import { create } from "../generated-tests/JsdomHarness.js";
import { runOnPage } from "./conformance-host.mjs";
import { allCases as cases } from "../generated-tests/RangeChecks.js";
import { cases as bindings, microtaskFixture } from "../generated-tests/BindingChecks.js";
import { cases as integration } from "../generated-tests/BindingIntegrationChecks.js";
import { cases as generated } from "../generated-tests/GeneratedChecks.js";
import { cases as attributes } from "../generated-tests/AttributeChecks.js";
import { cases as boundaries } from "../generated-tests/BoundaryChecks.js";
import { cases as placement, browserCases as placementBrowser } from "../generated-tests/PlacementChecks.js";
import { cases as integrationChecks, browserCases as integrationBrowser } from "../generated-tests/IntegrationChecks.js";
import { cases as unsafeHtml, unsafeMarkup } from "../generated-tests/UnsafeHtmlChecks.js";
import { cases as documentChecks } from "../generated-tests/DocumentChecks.js";
import { cases as sugar } from "../generated-tests/SugarChecks.js";
import { browserCases as templateBrowser } from "../generated-tests/TemplateChecks.js";
// Each conformance case runs over the page's document with the harness clock.
const bound = cases => cases.map(([name, run]) => [name, () => runOnPage(window, create, run)]);
window.rangeCases = [...bound(cases), ...bindings, ...integration, ...generated, ...attributes, ...bound(boundaries), ...bound(placement), ...integrationChecks, ...bound(unsafeHtml), ...bound(documentChecks), ...bound(sugar)];
window.bindingMicrotaskFixture = microtaskFixture;
window.templateBrowserCases = bound(templateBrowser);
window.placementBrowserCases = bound(placementBrowser);
window.integrationBrowserCases = integrationBrowser;
window.unsafeMarkup = unsafeMarkup;
</script>
</body></html>
