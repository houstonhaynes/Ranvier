<!doctype html>
<html><head><meta charset="utf-8"><title>Hydration checks</title></head><body>
<script type="module">
import { create } from "../generated-tests/JsdomHarness.js";
import { runOnPage } from "./conformance-host.mjs";
import { cases, browserCases, retentionCases } from "../generated-tests/HydrationChecks.js";
// Each conformance case runs over the page's document with the harness clock.
const bound = cases => cases.map(([name, run]) => [name, () => runOnPage(window, create, run)]);
window.hydrationCases = bound(cases);
window.hydrationBrowserCases = bound(browserCases);
window.hydrationRetentionCases = retentionCases;
</script>
</body></html>
